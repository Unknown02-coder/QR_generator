<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" role="img" aria-label="연락처 오류"><title>연락처 오류</title><rect x="0" y="0" width="1440" height="1300" rx="0" fill="#F9FAFB"/><text x="120" y="71" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">QR 만들기</text><text x="1170" y="71" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">GitHub 로그인</text><text x="1320" y="71" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="end">내 QR</text><rect x="120" y="99" width="1200" height="1" rx="0" fill="#E5E8EB"/><text x="120" y="181" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">필요한 QR을 빠르게 만들어요</text><text x="120" y="226" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">내용을 입력하고 미리본 뒤 저장하세요. 저장한 QR에서 파일을 받을 수 있어요.</text><rect x="120" y="276" width="588" height="900" rx="24" fill="#FFFFFF"/><rect x="732" y="276" width="588" height="900" rx="24" fill="#FFFFFF"/><text x="152" y="330" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">어떤 QR이 필요한가요?</text><rect x="152" y="360" width="96" height="44" rx="12" fill="#F2F4F6"/><text x="200" y="388" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">웹 주소</text><rect x="256" y="360" width="96" height="44" rx="12" fill="#F2F4F6"/><text x="304" y="388" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">와이파이</text><rect x="360" y="360" width="96" height="44" rx="12" fill="#E8F3FF"/><text x="408" y="388" fill="#3182F6" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">연락처</text><rect x="464" y="360" width="96" height="44" rx="12" fill="#F2F4F6"/><text x="512" y="388" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">텍스트</text><rect x="568" y="360" width="96" height="44" rx="12" fill="#F2F4F6"/><text x="616" y="388" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">이메일</text><rect x="152" y="424" width="524" height="1" rx="0" fill="#E5E8EB"/><text x="764" y="330" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">미리보기</text><text x="764" y="374" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">입력 오류를 수정하면 QR을 볼 수 있어요.</text><rect x="764" y="397" width="524" height="320" rx="20" fill="#F2F4F6"/><text x="1026" y="540" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">QR을 만들 수 없어요</text><text x="1026" y="575" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">연락처 정보를 확인해 주세요.</text><text x="764" y="752" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">오류를 수정하면 미리보기가 나타나요.</text><rect x="764" y="774" width="524" height="56" rx="12" fill="#F2F4F6"/><text x="1026" y="810" fill="#8B95A1" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">QR 저장하기</text><text x="764" y="863" fill="#6B7684" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">입력 오류를 수정하면 저장할 수 있어요.</text><text x="120" y="1257" fill="#8B95A1" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">QR에는 입력한 내용이 그대로 담겨요. 공유 전 내용을 확인해 주세요.</text><text x="152" y="465" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">성</text><text x="420" y="465" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">이름</text><rect x="152" y="483" width="256" height="56" rx="12" fill="#F2F4F6" stroke="#F04452" stroke-width="1.5"/><rect x="420" y="483" width="256" height="56" rx="12" fill="#F2F4F6" stroke="#F04452" stroke-width="1.5"/><text x="152" y="570" fill="#F04452" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">성과 이름 중 하나는 입력해 주세요.</text><text x="152" y="622" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">전화번호 · 선택</text><rect x="152" y="642" width="524" height="56" rx="12" fill="#F2F4F6"/><text x="168" y="677" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">+82 10-1234-5678</text><text x="152" y="733" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">이메일 · 선택</text><rect x="152" y="753" width="524" height="56" rx="12" fill="#F2F4F6" stroke="#F04452" stroke-width="1.5"/><text x="168" y="788" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">minji@</text><text x="152" y="841" fill="#F04452" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">올바른 이메일 주소를 입력해 주세요.</text><text x="152" y="892" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">회사 · 선택</text><rect x="152" y="912" width="524" height="56" rx="12" fill="#F2F4F6"/><text x="168" y="947" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">회사 이름</text><text x="152" y="1001" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">웹사이트 · 선택</text><rect x="152" y="1021" width="524" height="56" rx="12" fill="#F2F4F6" stroke="#F04452" stroke-width="1.5"/><text x="168" y="1056" fill="#191F28" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">example.com</text><text x="152" y="1109" fill="#F04452" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">웹사이트 주소는 http:// 또는 https://로 시작해야 해요.</text></svg>