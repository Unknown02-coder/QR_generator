spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/handmadeqr}
    username: ${DB_USERNAME:handmadeqr}
    password: ${DB_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}/login/oauth2/code/{registrationId}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
qr:
  encryption-key: ${QR_ENCRYPTION_KEY}
